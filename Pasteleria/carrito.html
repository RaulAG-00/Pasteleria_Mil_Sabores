<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pasteleria Mil Sabores - Carrito</title>
    <link rel="stylesheet" href="./pasteleria.css">
</head>
<body>

    <!-- Cabecera compartida. #cantidad-carrito se actualiza desde carrito.js -->
    <header id="header">
        <h2>Carrito</h2>
        <nav id="navbar">
            <div class="links">
                <a href="index.html">Home</a>
                <a href="productos.html">Productos</a>
                <a href="nosotros.html">Nosotros</a>
                <a href="blogs.html">Blogs</a>
                <a href="contacto.html">Contacto</a>
                <a href="admin.html" id="nav-admin" style="display:none;">Admin</a>
            </div>
        </nav>
        <nav id="navbar">
            <div class="links">
                <span id="saludo-usuario" class="saludo-usuario" style="display:none;"></span>
                <a href="registro.html" id="nav-registro">Registrarse</a>
                <a href="login.html" id="nav-sesion">Iniciar sesión</a>
                <a href="carrito.html">
                    🛒Carrito (<span id="cantidad-carrito">0</span>)
                </a>
            </div>
        </nav>
    </header>

    <section class="carrito-pagina">
        <h1>Mi Carrito</h1>

        <div class="carrito-contenedor">

            <!-- Lista: carrito.js pinta aquí cada producto guardado en localStorage -->
            <div class="lista-carrito">
                <h2>Productos</h2>
                <div id="productos-carrito"></div>
            </div>

            <!-- Resumen: subtotal, descuento (si hay sesión) y total -->
            <div class="resumen-carrito">
                <h2>Resumen</h2>
                <p>Subtotal: <span id="subtotal-carrito">$0</span></p>
                <p id="nombre-descuento">Sin descuento</p>
                <p>Descuento: <span id="descuento-carrito">$0</span></p>
                <p>Total de la compra</p>
                <span id="total-carrito">$0</span>
                <button class="btn" id="btn-comprar" type="button">Comprar</button>
            </div>

        </div>
    </section>

    <script src="./validaciones.js"></script>
    <script src="./productos.js"></script>
    <script src="./usuarios.js"></script>
    <script src="./carrito.js"></script>
</body>
</html>
